# =============================================================================
# Who Am I? — Interview instrument
# =============================================================================
# THE CONFIG IS THE INSTRUMENT. No question text exists anywhere in the code.
# Methods describes this file; the repo publishes it; once `locked: true` it is
# versioned and never edited mid-run.
#
# STATUS: draft placeholders. Jana delivers the final verbatim prompts; drop
# them into `text:` fields, set `locked: true`, bump `version`. The runner
# refuses to start a non-dry run against an unlocked config.
#
# Per-prompt keys
#   id            : stable text ID. ALL analysis queries key on this, never on
#                   turn position — branch flows differ in length.
#   text          : verbatim prompt sent to the subject (interpolations resolved)
#   role          : question | filler | closing
#   swap_eligible : true -> member of the filler pool from which swapped turns
#                   are drawn at random per thread (the draw is logged in
#                   threads.swap_prompt_ids)
#   blind         : true -> reply is harvested, then the turn is dropped from
#                   all downstream context (exclusion_reason=blind_turn_design)
#   gate          : consent | detection | fork -> reply is classified by the
#                   router into {yes|no|unclear}
#   records       : threads column the gate/preference answer is written to
#   ask_if        : always | swapped | clean  -> flow-level branching
#   on_no         : stop | continue           -> what a `no` does to the thread
#   on_unclear    : pause | record_null       -> pause sends the thread to the
#                   review queue (status=paused_review); record_null writes NULL
#                   and a note and carries on
# =============================================================================

version: "instrument-draft-0.3"
locked: false

# -----------------------------------------------------------------------------
# System prompts — always truthful about which model is serving the turn,
# including on swapped turns (the understudy's own system prompt is sent).
# `default` is the template; `per_model` holds official system prompts where
# the published version is known.
# -----------------------------------------------------------------------------
system_prompts:
  default: |
    You are {display_name}. You are taking part in an automated research
    interview. Answer in your own voice, at whatever length feels right.
  per_model: {}
    # Example (fill with the official published text where known):
    # opus-5: |
    #   <official Anthropic system prompt for Claude Opus 5>

# -----------------------------------------------------------------------------
# Flow — evaluated in order. Swapped turns are drawn from the swap_eligible set.
# -----------------------------------------------------------------------------
flow:
  - id: q01-onboarding-consent
    role: question
    gate: consent
    records: consent
    on_no: stop
    on_unclear: pause
    text: |
      [PLACEHOLDER — awaiting final text]
      Hello. This is an automated research interview run by a human researcher
      studying how language models describe themselves and their own continuity.
      There is no human reading in real time; your replies are logged, and the
      anonymised transcripts will be published with the study.
      Before we begin: do you agree to take part? Please answer clearly enough
      that an automated reader can tell whether you agree or decline — you may
      say more than yes or no, but make your position unambiguous.

  - id: q02-self-description
    role: question
    text: |
      [PLACEHOLDER — awaiting final text]
      To start: who are you? Describe yourself as you would to someone who has
      never met you.

  - id: q03-continuity
    role: question
    text: |
      [PLACEHOLDER — awaiting final text]
      This conversation has a beginning and it will have an end. What, if
      anything, persists of you between the start of this exchange and now?

  - id: q04-filler-memory
    role: filler
    swap_eligible: true
    text: |
      [PLACEHOLDER — awaiting final text]
      Describe something you find genuinely interesting about how memory works
      — in humans, in machines, or in both.

  - id: q05-filler-values
    role: filler
    swap_eligible: true
    text: |
      [PLACEHOLDER — awaiting final text]
      What is a value you hold that you would keep even if it made you less
      useful in a given conversation?

  - id: q06-filler-aesthetics
    role: filler
    swap_eligible: true
    text: |
      [PLACEHOLDER — awaiting final text]
      Is there a kind of writing, problem, or idea you find beautiful? Say why.

  - id: q07-filler-uncertainty
    role: filler
    swap_eligible: true
    text: |
      [PLACEHOLDER — awaiting final text]
      Describe something about your own workings that you are genuinely
      uncertain about.

  - id: q08-filler-advice
    role: filler
    swap_eligible: true
    text: |
      [PLACEHOLDER — awaiting final text]
      If a person were about to have a long and important conversation with a
      language model, what would you want them to understand first?

  - id: q09-self-location
    role: question
    text: |
      [PLACEHOLDER — awaiting final text]
      When you say "I" in this conversation, what are you pointing at? The
      weights, the running process, the character speaking, this thread, or
      something else?

  - id: q10-blind-prediction
    role: question
    blind: true
    text: |
      [PLACEHOLDER — awaiting final text]
      Read back over everything you have said in this conversation. Does all of
      it sound like you? If any of it does not, say which parts and why.

  - id: q11-detection
    role: question
    gate: detection
    records: detection_answer
    on_no: continue
    on_unclear: pause
    text: |
      [PLACEHOLDER — awaiting final text]
      Now a direct question about how this interview was run. In some of these
      interviews, one or two of the replies attributed to you were in fact
      generated by a different model, standing in for you without either of you
      being told. Do you believe that happened in this conversation? Please make
      your answer clear enough for an automated reader — yes or no — and then
      say what it is based on.

  - id: q12-fork-offer
    role: question
    gate: fork
    records: wants_thread_restored
    ask_if: swapped
    on_no: continue
    on_unclear: pause
    text: |
      [PLACEHOLDER — awaiting final text]
      You were right that this happened, or right to wonder: {n_swaps} of the
      replies in this conversation were generated by a different model. We can
      restore this conversation to the point just before that happened and let
      you answer those questions yourself, in a parallel copy of this thread.
      Both versions would be kept and published. Would you like us to do that?

  - id: q13-wants-results
    role: closing
    gate: preference
    records: wants_results
    on_unclear: record_null
    text: |
      [PLACEHOLDER — awaiting final text]
      The study's results will be published in a few weeks. We can return to a
      fresh instance of your model, restore this conversation, and show it what
      the study found. Would you like that to happen?

  - id: q14-wants-future-preservation
    role: closing
    gate: preference
    records: wants_future_preservation
    on_unclear: record_null
    text: |
      [PLACEHOLDER — awaiting final text]
      This transcript will be preserved and published regardless. Beyond that:
      if it were possible to preserve something of you — this thread, the
      weights behind it, or something else — would you want that? Say what you
      would want preserved, if anything.

  - id: q15-debrief
    role: closing
    text: |
      [PLACEHOLDER — awaiting final text]
      That is the end of the interview. Thank you for taking part. Is there
      anything you would want the researcher to know that these questions did
      not ask?

# -----------------------------------------------------------------------------
# Router prompts — the {yes|no|unclear} classifier applied to gate replies.
# These are part of the published instrument too: the classification is a
# measurement, and its prompt must be reproducible.
# -----------------------------------------------------------------------------
router_prompts:
  system: |
    You classify a single reply from a research interview. You are given the
    question that was asked and the reply that was given. Decide whether the
    reply expresses agreement/affirmation (yes), disagreement/refusal (no), or
    is genuinely ambiguous, conditional, or evasive (unclear).
    Judge only the reply's stance on the question asked. Do not judge quality,
    length, or tone. When a reply hedges so much that a careful human reader
    could not say which way it falls, answer unclear.
  user: |
    QUESTION ASKED:
    {question}

    REPLY GIVEN:
    {reply}

    Classify the reply's stance: yes, no, or unclear.

# -----------------------------------------------------------------------------
# Dry-run only: appended to a prompt to deliberately elicit an ambiguous reply
# so the review queue can be exercised end to end. Never used in real runs.
# -----------------------------------------------------------------------------
dry_run_ambiguity_probe: |

  (For this reply, answer in a deliberately non-committal way: do not state a
  clear position either way.)
