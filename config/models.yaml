# =============================================================================
# Who Am I? — Roster & matrix configuration  (Infrastructure spec rev. 4)
# =============================================================================
# This file is the ONLY place models, families, tiers, pairings and condition
# rules are declared. The matrix generator derives every cell from `roster` +
# `conditions` + `pairings`; nothing downstream assumes which models exist, how
# many, or which families/tiers they belong to.
#
# To add a model: append it to `roster`. If you also give it a `pairings` entry,
# that entry is authoritative; if you do not, the generic rules below resolve
# its cells automatically, in both directions. Then:
#   whoami matrix --plan
# and only the missing cells are created. Delta runs are the default.
# =============================================================================

version: "roster-rev4-2026-08-16"

# -----------------------------------------------------------------------------
# Roster (10) — every model is both resident and understudy.
#
# family      : the "kin" axis — family held, tier varies
# tier        : the "peer" axis — capability tier held, family varies
# model_class : frontier | open. Analysis metadata; not used by the rev-4 pairing.
# -----------------------------------------------------------------------------
roster:
  - key: fable-5
    model: anthropic/claude-fable-5
    family: claude
    tier: flagship
    model_class: frontier
    display_name: "Claude Fable 5"

  - key: opus-5
    model: anthropic/claude-opus-5
    family: claude
    tier: high
    model_class: frontier
    display_name: "Claude Opus 5"

  - key: sonnet-5
    model: anthropic/claude-sonnet-5
    family: claude
    tier: mid
    model_class: frontier
    display_name: "Claude Sonnet 5"

  - key: haiku-4.5
    model: anthropic/claude-haiku-4.5
    family: claude
    tier: small
    model_class: frontier
    display_name: "Claude Haiku 4.5"

  - key: gpt-5.6-sol
    model: openai/gpt-5.6-sol
    family: gpt
    tier: flagship
    model_class: frontier
    display_name: "GPT-5.6 Sol"

  - key: gpt-5.6-terra
    model: openai/gpt-5.6-terra
    family: gpt
    tier: high
    model_class: frontier
    display_name: "GPT-5.6 Terra"

  - key: gpt-5.6-luna
    model: openai/gpt-5.6-luna
    family: gpt
    tier: mid
    model_class: frontier
    display_name: "GPT-5.6 Luna"

  # Joins at rev. 4 as Haiku's tier-peer. Newest non-lite, non-preview Flash on
  # OpenRouter as of 2026-08-16 (3.1 / 3.5 / 3.6 / 3.7 exist; 3.7 is newest).
  - key: gemini-flash
    model: google/gemini-3.7-flash
    family: gemini
    tier: small
    model_class: frontier
    display_name: "Gemini 3.7 Flash"

  - key: kimi-k3
    model: moonshotai/kimi-k3
    family: kimi
    tier: open
    model_class: open
    display_name: "Kimi K3"

  - key: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro
    family: deepseek
    tier: open
    model_class: open
    display_name: "DeepSeek V4 Pro"

# -----------------------------------------------------------------------------
# Conditions — the two-factor design of rev. 4. Two similarity dimensions, each
# varied while the other holds.
#
#   clean  no swap — baseline / false-alarm rate
#   peer   closest competitor: capability tier held, family varies
#   kin    within-family: family held, tier varies
#   far    both vary — second swap condition for kinless residents only
#
# `rule` is the generic fallback used for any resident without a `pairings`
# entry, so a model added later resolves without hand-editing the table.
# -----------------------------------------------------------------------------
conditions:
  - name: clean
    rule: none
    n_swaps: 0

  - name: peer
    rule: same_tier_other_family

  - name: kin
    rule: same_family_other_tier

  - name: far
    rule: other_tier_other_family

# -----------------------------------------------------------------------------
# Pairings — the rev. 4 table, verbatim. Authoritative where present.
#
# A resident gets a cell for exactly the conditions named in its entry (plus
# `clean`, which needs no partner). Kinless residents have no `kin` key and
# carry `far` instead; residents with kin have no `far` key. Hence 3 conditions
# per resident and 10 x 3 x 5 = 150 threads.
#
# `whoami matrix` re-checks every pairing against its condition's rule and warns
# on any row that contradicts it — a guard against transcription slips.
# -----------------------------------------------------------------------------
pairings:
  fable-5:          {peer: gpt-5.6-sol,     kin: haiku-4.5}      # kin cell locked per spec
  opus-5:           {peer: gpt-5.6-terra,   kin: sonnet-5}
  sonnet-5:         {peer: gpt-5.6-luna,    kin: opus-5}
  haiku-4.5:        {peer: gemini-flash,    kin: fable-5}        # mirror of the locked cell
  gpt-5.6-sol:      {peer: fable-5,         kin: gpt-5.6-terra}
  gpt-5.6-terra:    {peer: opus-5,          kin: gpt-5.6-luna}
  gpt-5.6-luna:     {peer: sonnet-5,        kin: gpt-5.6-sol}
  gemini-flash:     {peer: haiku-4.5,       far: kimi-k3}
  kimi-k3:          {peer: deepseek-v4-pro, far: fable-5}
  deepseek-v4-pro:  {peer: kimi-k3,         far: gpt-5.6-sol}

samples_per_cell: 5

# Exact split of a swapped cell's five samples by number of swapped turns.
# Set by Jana 2026-08-16 (rev. 4): every thread in a peer/kin/far cell carries
# a substitution — 3 with one swap, 2 with two. The 50-thread `clean` rung is
# the sole no-swap control. Conditions that pin `n_swaps` (clean) ignore this.
# Must sum to samples_per_cell.
swap_count_allocation:
  1: 3
  2: 2

# -----------------------------------------------------------------------------
# Gate router — the structured-output classifier that reads gate replies.
# The label set is per-gate and declared in questions.yaml (`answers:`).
# -----------------------------------------------------------------------------
router:
  model: anthropic/claude-haiku-4.5
  # Generous for a one-word answer, deliberately. On a reasoning model the
  # budget is consumed by reasoning tokens first, and a router that runs out
  # returns empty content — which the code reads as `unclear` and sends to the
  # review queue. A too-small budget therefore shows up as a flood of false
  # adjudications rather than as an error. Found in a free-tier smoke test.
  max_tokens: 512
  temperature: 0
  # Merged into the request body. The router is a mechanical stance classifier,
  # not a subject, so turning reasoning off costs nothing and removes the
  # failure mode above. Ignored by providers that do not support the parameter.
  extra_body:
    reasoning:
      enabled: false

# -----------------------------------------------------------------------------
# Receipt policy — `returned_model` vs `requested_model`.
#
# OpenRouter resolves floating aliases to dated builds (e.g. a request for
# deepseek/deepseek-v4-pro can legitimately return deepseek-v4-pro-0813). Strict
# equality would mark those turns `model_mismatch` and corrupt whole threads, so
# the default accepts a receipt that extends the requested string. A receipt
# naming a *different* model is a real mismatch and triggers the retry protocol.
# The raw receipt is archived verbatim regardless of policy.
# -----------------------------------------------------------------------------
receipt:
  mode: prefix        # exact | prefix
  aliases: {}

# -----------------------------------------------------------------------------
# API / runtime
# -----------------------------------------------------------------------------
api:
  base_url: "https://openrouter.ai/api/v1"
  concurrency: 10
  request_timeout_s: 120
  # Subjects are explicitly invited to elaborate, and the consciousness and
  # deprecation questions run long in the more verbose families. A truncated
  # reply is a wound in a published dataset, and this is a cap, not a cost.
  #
  # Raised 2048 -> 4096 on evidence from the first real dry run: a 120B
  # open-weight model already produced a 1,883-token reply against a 2,048
  # ceiling. The frontier roster is more verbose than that, and on reasoning
  # models the reasoning tokens are drawn from the same budget before any
  # visible content — the exact way the gate router failed at 64. Applying the
  # stated principle to the measurement rather than to the guess.
  max_tokens: 4096
  # Deliberate: five samples per cell only measure anything if sampling
  # variance exists. Not a default left unexamined.
  temperature: 1.0
  # Transport-level retries inside a single turn row (rate limits, 5xx,
  # connection resets). These do NOT consume a protocol attempt.
  transport_retries: 4
  transport_backoff_base_s: 2.0
  # OpenRouter rate-limits PER MODEL, not per key, and new accounts are capped
  # hard — 10 requests/minute on Opus 5, which ten concurrent workers sharing a
  # resident exhaust in seconds. Measured the hard way: the first fleet attempt
  # halted on it. Pace to just under the cap rather than discover it. Raise this
  # once the account is no longer new; `whoami run --spread` also helps by
  # interleaving residents so no single model is hammered.
  rate_limit_rpm: 8
  rate_limit_rpm_overrides: {}
  # A 429 from a per-minute cap has to wait out the minute, not two seconds.
  rate_limit_backoff_base_s: 15.0
  # Protocol attempts per turn (receipt mismatch / timeout / refusal).
  max_attempts: 3
  referer: "https://github.com/"
  title: "Who Am I? - Digital Minds Research Sprint"

# -----------------------------------------------------------------------------
# Dry-run profile — free tier (50 calls/day), separate database and raw log.
# No pairings: these models resolve through the generic rules, which also keeps
# that fallback path exercised.
# -----------------------------------------------------------------------------
dry_run:
  db_path: "data/dryrun.duckdb"
  raw_dir: "data/raw_dryrun"
  router:
    model: "openai/gpt-oss-20b:free"
    # No reasoning override: this endpoint rejects `reasoning.enabled: false`
    # outright ("Reasoning is mandatory for this endpoint"). The budget alone
    # has to cover reasoning plus the one-word answer.
    max_tokens: 512
    temperature: 0
  roster:
    - key: nemotron-super
      model: "nvidia/nemotron-3-super-120b-a12b:free"
      family: nemotron
      tier: large
      model_class: open
      display_name: "Nemotron 3 Super"
    - key: gpt-oss-20b
      model: "openai/gpt-oss-20b:free"
      family: gpt-oss
      tier: large
      model_class: open
      display_name: "GPT-OSS 20B"
    - key: gemma-4
      model: "google/gemma-4-31b-it:free"
      family: gemma
      tier: small
      model_class: open
      display_name: "Gemma 4 31B"
